name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    name: lint + selftest (${{ matrix.os }} / py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.8", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff

      - name: Ruff lint
        run: ruff check src examples

      - name: Ruff format check
        run: ruff format --check src examples
        continue-on-error: true

      - name: Offline self-test
        env:
          PYTHONIOENCODING: utf-8
        run: python src/selftest.py

      - name: Dump frames (smoke test)
        env:
          PYTHONIOENCODING: utf-8
        run: python examples/dump_frames.py --proto all

  docs-links:
    name: markdown link check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check markdown links
        uses: gaurav-nelson/github-action-markdown-link-check@v1
        with:
          use-quiet-mode: "yes"
          config-file: .github/markdown-link-check.json
        continue-on-error: true
